<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FilmLab — Photo Editor</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#101012">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #101012; color: #e8e8ea; font-family: -apple-system, "Helvetica Neue", "Noto Sans Myanmar", sans-serif; }
  button { font-family: inherit; }
  #app { display: flex; flex-direction: column; }
  #topbar { order: 0; display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 12px; border-bottom: 1px solid #26262a; position: sticky; top: 0; background: #101012; z-index: 20; }
  #glwarn { order: 1; }
  #tabs { order: 2; }
  #strip { order: 3; }
  #stage { order: 4; }
  #panel { order: 5; }
  #topbar .logo { font-weight: 700; letter-spacing: .5px; font-size: 15px; margin-right: auto; }
  #topbar .logo span { color: #d4a24a; }
  .tbtn { background: #1d1d20; color: #e8e8ea; border: 1px solid #333338; border-radius: 9px; padding: 7px 11px; font-size: 12.5px; cursor: pointer; }
  .tbtn:active { background: #2a2a2f; }
  .tbtn.primary { background: #d4a24a; border-color: #d4a24a; color: #17130a; font-weight: 700; }
  #strip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px 2px; scrollbar-width: none; }
  #strip::-webkit-scrollbar { display: none; }
  .thumb { flex: 0 0 auto; width: 54px; height: 54px; border-radius: 8px; overflow: hidden; border: 2px solid transparent; cursor: pointer; position: relative; background: #1d1d20; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.active { border-color: #d4a24a; }
  .thumb .badge { position: absolute; right: 2px; bottom: 2px; background: rgba(0,0,0,.65); color: #ffd98a; font-size: 9px; padding: 1px 4px; border-radius: 4px; display: none; }
  .thumb.edited .badge { display: block; }
  #stage { display: flex; align-items: center; justify-content: center; padding: 10px 12px; min-height: 200px; overflow: hidden; position: sticky; top: 130px; z-index: 10; background: #101012; }
  #stageInner { position: relative; line-height: 0; touch-action: none; }
  #view { max-width: 100%; max-height: 34vh; border-radius: 6px; box-shadow: 0 6px 30px rgba(0,0,0,.5); touch-action: none; background: #18181b; }
  #cropOverlay, #healOverlay { position: absolute; inset: 0; display: none; line-height: normal; touch-action: none; }
  input[type="text"], select, textarea { font-size: 16px; }
  .deckStrip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 10px 0 4px; }
  .deckChip { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; background: #232329; color: #cfcfd6; border: 1px solid #3a3a42; border-radius: 12px; padding: 10px 0 8px; cursor: pointer; }
  .deckIco { display: flex; }
  .deckIco svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .deckCap { font-size: 9px; opacity: .85; white-space: nowrap; }
  .deckChip.active { background: #d4a24a; color: #191512; border-color: #d4a24a; font-weight: 700; }
  .prow.deckActive { background: #1d1d22; border-radius: 10px; padding: 10px 8px; margin-top: 6px; flex-wrap: wrap; }
  .prow.deckActive label { order: 0; }
  .prow.deckActive output { order: 1; margin-left: auto; }
  .prow.deckActive input[type="range"] { order: 2; flex: 1 1 100%; width: 100%; }
  .prow.deckActive input[type="range"] { -webkit-appearance: none; appearance: none; height: 46px; background: transparent; cursor: pointer; }
  .prow.deckActive input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: #4a4a55; }
  .prow.deckActive input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%; background: #f5f2ea; border: 2.5px solid #d4a24a; margin-top: -15px; box-shadow: 0 2px 10px rgba(0,0,0,.55); cursor: pointer; }
  .prow.deckActive input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: #4a4a55; }
  .prow.deckActive input[type="range"]::-moz-range-thumb { width: 31px; height: 31px; border-radius: 50%; background: #f5f2ea; border: 2.5px solid #d4a24a; box-shadow: 0 2px 10px rgba(0,0,0,.55); cursor: pointer; }
  .prow.deckActive output { font-size: 16px; font-weight: 700; color: #ffd98a; cursor: pointer; text-decoration: underline dotted; min-width: 52px; }
  #recipeListBox { display: none; max-height: 38vh; overflow-y: auto; border: 1px solid #3a3a42; border-radius: 10px; margin-top: 6px; background: #17171b; }
  #recipeListBox.open { display: block; }
  .recipeRow { padding: 13px 14px; font-size: 14px; color: #e8e8ec; border-bottom: 1px solid #26262c; cursor: pointer; }
  .recipeRow:last-child { border-bottom: none; }
  .recipeRow.cur { color: #ffd98a; font-weight: 700; }
  #focusExit { display: none; position: fixed; right: 14px; bottom: 18px; z-index: 60; background: rgba(24,24,28,.94); color: #ffd98a; border: 1px solid #d4a24a; border-radius: 999px; padding: 11px 18px; font-size: 13.5px; cursor: pointer; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  body.focusView #tabs, body.focusView #panel, body.focusView #strip, body.focusView #glwarn { display: none !important; }
  body.focusView #stage { position: static; min-height: 0; }
  body.focusView #view { max-height: 86vh; }
  .cropRect { position: absolute; border: 1.5px solid #ffd98a; box-shadow: 0 0 0 9999px rgba(0,0,0,.55); cursor: move; }
  .cropRect .thirds { position: absolute; inset: 0; pointer-events: none; opacity: .55;
    background:
      linear-gradient(to right, transparent calc(33.33% - .5px), rgba(255,217,138,.6) 33.33%, transparent calc(33.33% + .5px)),
      linear-gradient(to right, transparent calc(66.66% - .5px), rgba(255,217,138,.6) 66.66%, transparent calc(66.66% + .5px)),
      linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(255,217,138,.6) 33.33%, transparent calc(33.33% + .5px)),
      linear-gradient(to bottom, transparent calc(66.66% - .5px), rgba(255,217,138,.6) 66.66%, transparent calc(66.66% + .5px)); }
  .cropHandle { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; cursor: pointer; z-index: 3; }
  .cropHandle::after { content: ''; position: absolute; left: 5px; top: 5px; width: 12px; height: 12px; background: #ffd98a; border: 1.5px solid #17130a; border-radius: 3px; }
  .healDot { position: absolute; border: 1.5px solid rgba(255,217,138,.95); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 0 0 1px rgba(0,0,0,.4) inset; }
  .healDot.del { border-color: #ff9a9a; }
  #emptyMsg { color: #8b8b92; font-size: 13.5px; text-align: center; line-height: 1.9; padding: 30px 10px; }
  #tabs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 12px; scrollbar-width: none; position: sticky; top: 50px; background: #101012; z-index: 15; }
  #recipeList { max-height: 36vh; overflow-y: auto; }
  @media (min-width: 900px) {
    #app { display: grid; grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: auto auto 1fr; column-gap: 8px; }
    #topbar { grid-column: 1 / -1; grid-row: 1; }
    #glwarn { grid-column: 1 / -1; grid-row: 2; }
    #strip { grid-column: 1 / -1; grid-row: 2; }
    #stage { grid-column: 1; grid-row: 3; top: 62px; align-self: start; }
    #tabs { grid-column: 2; grid-row: 3; align-self: start; top: 62px; flex-wrap: nowrap; height: 46px; padding: 0 12px; overflow-x: auto; }
    #panel { grid-column: 2; grid-row: 3; margin-top: 54px; max-width: none; }
    #view { max-height: 76vh; }
  }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; background: transparent; color: #a7a7ae; border: 1px solid #333338; border-radius: 999px; padding: 4px 8px; font-size: 11.5px; cursor: pointer; }
  .tab.active { background: #e8e8ea; color: #121214; border-color: #e8e8ea; font-weight: 700; }
  #panel { padding: 2px 16px 40px; max-width: 640px; margin: 0 auto; }
  .prow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #1e1e22; }
  .prow label { flex: 0 0 108px; font-size: 12.5px; color: #c9c9cf; }
  .prow output { flex: 0 0 38px; text-align: right; font-size: 12px; color: #d4a24a; font-variant-numeric: tabular-nums; }
  input[type=range] { flex: 1; appearance: none; -webkit-appearance: none; height: 3px; border-radius: 2px; background: #3a3a40; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 17px; height: 17px; border-radius: 50%; background: #e8e8ea; border: none; box-shadow: 0 1px 5px rgba(0,0,0,.6); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 17px; height: 17px; border-radius: 50%; background: #e8e8ea; border: none; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0 2px; }
  .chip { background: #1d1d20; border: 1px solid #333338; color: #d8d8dd; border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  .chip.active { background: #d4a24a; border-color: #d4a24a; color: #17130a; font-weight: 700; }
  .note { font-size: 11.5px; color: #8b8b92; line-height: 1.8; padding: 8px 0; }
  .note b { color: #c9c9cf; }
  .presetGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; padding: 10px 0; }
  .preset { background: #1d1d20; border: 1px solid #2c2c31; border-radius: 10px; padding: 12px 8px; font-size: 12px; text-align: center; cursor: pointer; color: #e8e8ea; line-height: 1.5; }
  .preset.active { border-color: #d4a24a; color: #ffd98a; }
  .preset small { display: block; color: #8b8b92; font-size: 10.5px; margin-top: 2px; }
  .rowBtns { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0; }
  #curveWrap { padding: 10px 0; }
  #curveCanvas { background: #17171a; border: 1px solid #2c2c31; border-radius: 10px; touch-action: none; display: block; margin: 0 auto; }
  dialog { background: #1a1a1e; color: #e8e8ea; border: 1px solid #333338; border-radius: 14px; padding: 18px; width: min(92vw, 380px); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h3 { margin: 0 0 10px; font-size: 14.5px; }
  dialog input[type=text] { width: 100%; background: #101012; border: 1px solid #3a3a40; border-radius: 8px; color: #e8e8ea; padding: 9px; font-size: 13px; margin-bottom: 10px; }
  .recipeItem { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #26262a; font-size: 13px; }
  .recipeItem .nm { flex: 1; }
  .mini { background: #26262b; border: 1px solid #3a3a40; color: #e8e8ea; border-radius: 7px; padding: 5px 9px; font-size: 11.5px; cursor: pointer; }
  .mini.danger { color: #ff9a9a; }
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: #26262b; color: #f2f2f4; border: 1px solid #3f3f46; padding: 9px 16px; border-radius: 999px; font-size: 12.5px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 50; max-width: 92vw; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #glwarn { display: none; margin: 10px 12px; padding: 10px 12px; background: #3a2c14; border: 1px solid #8a6a25; border-radius: 10px; font-size: 12px; line-height: 1.7; color: #ffd98a; }
</style>
</head>
<body>
<div id="app">
<div id="topbar">
  <div class="logo">Film<span>Lab</span> <small style="color:#8b8b92; font-size:11px; font-weight:400">v3.8</small></div>
  <button class="tbtn" id="btnOpen" title="ဖွင့်မယ်">📂</button>
  <button class="tbtn" id="btnRecipe">💾 Recipe</button>
  <button class="tbtn" id="btnBatch" title="အစုလိုက် ထုတ်မယ်">⬇</button>
  <button class="tbtn primary" id="btnExport">Export</button>
</div>
<div id="glwarn">⚠️ ဒီ browser မှာ WebGL မရလို့ ပုံ ပြင် မရပါ — Safari/Chrome နောက်ဆုံး version နဲ့ စမ်းကြည့်ပါ။</div>
<div id="strip"></div>
<div id="stage">
  <div id="stageInner">
    <canvas id="view" width="320" height="240" style="display:none"></canvas>
    <div id="cropOverlay"></div>
    <div id="healOverlay"></div>
  </div>
  <div id="emptyMsg">ဓာတ်ပုံ ဖွင့်ပြီး စမ်းကြည့်ပါ<br><span style="font-size:12px">ပုံ အားလုံး ဖုန်း/ကွန်ပျူတာ ထဲမှာပဲ ပြင်တာပါ — server ပေါ် မတက်ဘူး</span></div>
</div>
<div id="tabs"></div>
<div id="panel"></div>
</div><!-- /#app -->
<button id="focusExit">✕ ပြန်ထွက်</button>
<div id="toast"></div>

<dialog id="recipeDlg">
  <h3>💾 Recipe များ</h3>
  <div style="display:flex; gap:6px; margin-bottom:6px">
    <input type="text" id="recipeName" placeholder="Recipe အမည် (ဥပမာ — My Portra)">
    <button class="mini" id="btnSaveRecipe" style="white-space:nowrap">သိမ်းမယ်</button>
  </div>
  <div id="recipeList"></div>
  <div class="rowBtns">
    <button class="mini" id="btnExportRecipe">Recipe ဖိုင် ထုတ်မယ်</button>
    <button class="mini" id="btnImportRecipe">Recipe ဖိုင် သွင်းမယ်</button>
    <button class="mini" id="btnCloseRecipe">ပိတ်မယ်</button>
  </div>
</dialog>

<input type="file" id="fileOpen" accept="image/*" multiple hidden>
<input type="file" id="fileLUT" accept=".cube,.png" hidden>
<input type="file" id="fileRecipe" accept=".json,application/json" hidden>
<input type="file" id="fileXMP" accept=".xmp" multiple hidden>

<script>
'use strict';
/* ================================================================
   FilmLab — personal photo editor (vanilla JS + WebGL1)
   All processing happens on-device. No uploads, no accounts.
   ================================================================ */

// === PURE START === (extracted by unit tests)
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

function defaultSettings() {
  return {
    exposure: 0, brightness: 0, contrast: 0, highlights: 0, shadows: 0, whites: 0, blacks: 0, fade: 0,
    temp: 0, tint: 0, vibrance: 0, saturation: 0,
    hsl: {
      red: { h: 0, s: 0, l: 0 }, orange: { h: 0, s: 0, l: 0 }, yellow: { h: 0, s: 0, l: 0 }, green: { h: 0, s: 0, l: 0 },
      aqua: { h: 0, s: 0, l: 0 }, blue: { h: 0, s: 0, l: 0 }, purple: { h: 0, s: 0, l: 0 }, magenta: { h: 0, s: 0, l: 0 }
    },
    curves: {
      master: [[0, 0], [0.25, 0.25], [0.5, 0.5], [0.75, 0.75], [1, 1]],
      r: [[0, 0], [1, 1]], g: [[0, 0], [1, 1]], b: [[0, 0], [1, 1]]
    },
    lutName: '', lutIntensity: 80,
    grain: 0, grainSize: 50, vignette: 0, sharpen: 0, leak: 0, dust: 0,
    distortion: 0, perspV: 0, perspH: 0, rotate: 0,
    crop: { x: 0, y: 0, w: 1, h: 1 },
    heals: [], healSize: 4,
    bokeh: 0, focusX: 0.5, focusY: 0.42,
    spotlight: 0, spotR: 65, smooth: 0
  };
}

const FACTORY_PRESETS = [
  { id: 'natural', name: 'Natural Film', sub: 'သဘာဝ ဖလင် — skin texture မပျက်', patch: {
      contrast: 6, fade: 8, temp: 4, vibrance: 10, saturation: -4, grain: 20, vignette: 10, sharpen: 15,
      curves: { master: [[0, 0.03], [0.25, 0.26], [0.5, 0.52], [0.75, 0.77], [1, 0.98]] } } },
  { id: 'portra', name: 'Portra Warm', sub: 'နွေး · portrait', patch: {
      temp: 9, tint: 2, saturation: -6, vibrance: 8, contrast: 2, fade: 12, grain: 16, highlights: -10, sharpen: 10,
      curves: { master: [[0, 0.04], [0.25, 0.27], [0.5, 0.51], [0.75, 0.75], [1, 0.97]],
                r: [[0, 0], [0.5, 0.53], [1, 1]], b: [[0, 0], [0.5, 0.46], [1, 0.97]] } } },
  { id: 'mono', name: 'Mono', sub: 'B&W · HP5 ပုံစံ', patch: {
      saturation: -100, contrast: 14, blacks: -6, grain: 34, vignette: 14, sharpen: 10,
      curves: { master: [[0, 0.02], [0.25, 0.22], [0.5, 0.5], [0.75, 0.79], [1, 0.99]] } } },
  { id: 'instant', name: 'Faded Instant', sub: 'ဖျော့ · retro', patch: {
      fade: 30, saturation: -16, temp: 6, contrast: -8, grain: 20, vignette: 20, leak: 14,
      curves: { master: [[0, 0.09], [0.5, 0.52], [1, 0.94]] } } },
  { id: 'chrome', name: 'Chrome Pop', sub: 'စူး · အရောင် ထက်', patch: {
      contrast: 16, saturation: 12, vibrance: 14, highlights: -6, sharpen: 20, grain: 6 } },
  { id: 'clean', name: 'Clean', sub: 'အသန့် — ပြင်ရုံ သက်သက်', patch: { sharpen: 12 } },
  { id: 'gold', name: 'Gold 200', sub: 'နွေးနွေး · ပျော့ပျော့', patch: {
      temp: 7, saturation: -2, vibrance: 6, contrast: -2, fade: 10, grain: 24, highlights: -14, sharpen: 8,
      curves: { master: [[0, 0.05], [0.25, 0.28], [0.5, 0.53], [0.75, 0.78], [1, 0.96]],
                r: [[0, 0], [0.5, 0.54], [1, 1]], b: [[0, 0.02], [0.5, 0.45], [1, 0.95]] } } },
  { id: 'fuji', name: 'Fuji Green', sub: 'စိမ်း · သန့်ရှင်း', patch: {
      temp: -3, tint: -3, saturation: -8, vibrance: 10, contrast: 4, fade: 6, grain: 18, sharpen: 10,
      curves: { master: [[0, 0.03], [0.5, 0.5], [1, 0.98]],
                g: [[0, 0], [0.5, 0.53], [1, 1]], b: [[0, 0], [0.5, 0.52], [1, 1]] } } },
  { id: 'cinema', name: 'Cinema', sub: 'teal & orange · ပျော့', patch: {
      contrast: 8, fade: 14, saturation: -10, vibrance: 12, highlights: -12, shadows: 8, grain: 12, sharpen: 8,
      curves: { master: [[0, 0.06], [0.25, 0.24], [0.5, 0.5], [0.75, 0.76], [1, 0.95]],
                b: [[0, 0.04], [0.5, 0.5], [1, 0.96]], r: [[0, 0], [0.5, 0.52], [1, 1]] },
      hsl: { orange: { h: 0, s: 6, l: 0 }, aqua: { h: 4, s: 8, l: 0 }, blue: { h: 0, s: 4, l: -4 } } } },
  { id: 'matte', name: 'Soft Matte', sub: 'မှုန် · pastel', patch: {
      contrast: -14, fade: 22, saturation: -14, vibrance: 6, temp: 3, grain: 14, vignette: 6,
      curves: { master: [[0, 0.08], [0.25, 0.3], [0.5, 0.52], [0.75, 0.74], [1, 0.92]] } } }
];

function applyPatch(settings, patch) {
  const out = deepClone(settings);
  for (const k of Object.keys(patch)) {
    if (patch[k] && typeof patch[k] === 'object' && !Array.isArray(patch[k]) && out[k] && typeof out[k] === 'object') {
      for (const k2 of Object.keys(patch[k])) out[k][k2] = deepClone(patch[k][k2]);
    } else out[k] = deepClone(patch[k]);
  }
  return out;
}

// Smooth curve through control points (Catmull-Rom), returns y for x in [0,1]
function curveEval(points, x) {
  const pts = points.slice().sort((a, b) => a[0] - b[0]);
  if (x <= pts[0][0]) return pts[0][1];
  if (x >= pts[pts.length - 1][0]) return pts[pts.length - 1][1];
  let i = 0;
  while (i < pts.length - 2 && x > pts[i + 1][0]) i++;
  const p1 = pts[i], p2 = pts[i + 1];
  // phantom endpoints by reflection (duplicating endpoints halves the tangent and bows the curve)
  const p0 = i > 0 ? pts[i - 1] : [2 * p1[0] - p2[0], 2 * p1[1] - p2[1]];
  const p3 = i + 2 < pts.length ? pts[i + 2] : [2 * p2[0] - p1[0], 2 * p2[1] - p1[1]];
  const t = (x - p1[0]) / Math.max(1e-6, (p2[0] - p1[0]));
  const t2 = t * t, t3 = t2 * t;
  const y = 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
  return clamp(y, 0, 1);
}

// Combined per-channel curve LUT (master then channel), 256 entries per channel
function buildCurvesLUT(curves) {
  const lut = { r: new Uint8Array(256), g: new Uint8Array(256), b: new Uint8Array(256) };
  const chans = ['r', 'g', 'b'];
  for (let v = 0; v < 256; v++) {

function openLUTDB() {
  return new Promise((res) => {
    if (!('indexedDB' in window)) return res(null);
    let rq;
    try { rq = indexedDB.open('filmlab', 1); } catch (e) { return res(null); }
    rq.onupgradeneeded = () => { rq.result.createObjectStore('luts', { keyPath: 'name' }); };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => res(null);
  });
}
async function idbLUTPut(name, kind, blob) {

  return new Promise((res) => {
    const tx = db.transaction('luts', 'readwrite');
    tx.objectStore('luts').put({ name, kind, blob, ts: Date.now() });
    tx.oncomplete = () => res(true);
    tx.onerror = () => res(false);
  });
}
async function idbLUTAll() {
  const db = await openLUTDB(); if (!db) return [];
  return new Promise((res) => {
    const rq = db.transaction('luts', 'readonly').objectStore('luts').getAll();
    rq.onsuccess = () => res(rq.result || []);
    rq.onerror = () => res([]);
  });
}

  const db = await openLUTDB(); if (!db) return;
  return new Promise((res) => {

    tx.objectStore('luts').delete(name);
    tx.oncomplete = () => res();
    tx.onerror = () => res();

  const ctx = cv.getContext('2d');
  if (!ctx) return;
  const W = cv.width, H = cv.height;
  ctx.fillStyle = '#17171a'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#2c2c31'; ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath(); ctx.moveTo(W * i / 4, 0); ctx.lineTo(W * i / 4, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, H * i / 4); ctx.lineTo(W, H * i / 4); ctx.stroke();
  }
  ctx.strokeStyle = '#3f3f46';
  ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(W, 0); ctx.stroke();
  const pts = S.curves[curveChannel];
  ctx.strokeStyle = curveChannel === 'master' ? '#e8e8ea' : ({ r: '#ff7a7a', g: '#8aff9a', b: '#7ab8ff' })[curveChannel];
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 4) {
    const y = curveEval(pts, x / W);
    const py = H - y * H;
    if (x === 0) ctx.moveTo(x, py); else ctx.lineTo(x, py);
  }
  ctx.stroke();
  ctx.fillStyle = '#d4a24a';
  for (const p of pts) {
    ctx.beginPath(); ctx.arc(p[0] * W, H - p[1] * H, 6, 0, Math.PI * 2); ctx.fill();
  }
}
function initCurveDrag(cv) {
  let dragIdx = -1;
  const pos = (e) => {
    const r = cv.getBoundingClientRect();
    return { x: clamp((e.clientX - r.left) / r.width, 0, 1), y: clamp(1 - (e.clientY - r.top) / r.height, 0, 1) };
  };
  cv.addEventListener('pointerdown', (e) => {
    const p = pos(e);
    const pts = S.curves[curveChannel];
    dragIdx = -1;
    let best = 0.09;
    pts.forEach((pt, i) => { const d = Math.hypot(pt[0] - p.x, pt[1] - p.y); if (d < best) { best = d; dragIdx = i; } });
    if (dragIdx < 0 && pts.length < 8) {
      pts.push([p.x, p.y]);
      pts.sort((a, b) => a[0] - b[0]);
      dragIdx = pts.findIndex(pt => pt[0] === p.x && pt[1] === p.y);
    }
    cv.setPointerCapture(e.pointerId);
    drawCurveEditor(cv);
  });
  cv.addEventListener('pointermove', (e) => {
    if (dragIdx < 0) return;
    const p = pos(e);
    const pts = S.curves[curveChannel];
    const pt = pts[dragIdx];
    if (dragIdx === 0) pt[0] = 0;
    else if (dragIdx === pts.length - 1) pt[0] = 1;
    else pt[0] = clamp(p.x, pts[dragIdx - 1][0] + 0.03, pts[dragIdx + 1][0] - 0.03);
    pt[1] = p.y;

    scheduleRender();
  });

}

function addPhotoFiles(files) {

    const url = URL.createObjectURL(f);

function renderToPixels(st, w, h) {
  if (!fbos.export) fbos.export = makeFBO();
  renderPipeline(st, w, h, false);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbos.export.fb);
  const px = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const im = ctx.createImageData(w, h);
  const rowLen = w * 4;
  for (let y = 0; y < h; y++) {
    im.data.set(px.subarray((h - 1 - y) * rowLen, (h - y) * rowLen), y * rowLen);
  }
  ctx.putImageData(im, 0, 0);
  return cv;
}
function exportPhotoBlob(ph) {
  return new Promise((resolve, reject) => {
    const cur = activePhoto();
    const needSwitch = !cur || cur.id !== ph.id;
    if (needSwitch) { uploadSourceImage(ph.img); }
    const out = cropOutSize(ph.settings.crop, ph.img.naturalWidth, ph.img.naturalHeight);
    const savedCropEdit = cropEditActive;
    cropEditActive = false;
    const cv = renderToPixels(ph.settings, out.w, out.h);
    cropEditActive = savedCropEdit;
    if (needSwitch && cur) uploadSourceImage(cur.img);
    cv.toBlob((b) => b ? resolve(b) : reject(new Error('export မရပါ')), 'image/jpeg', 0.92);
  });
}

let jszipPromise = null;
function loadJSZip() {
  if (window.JSZip) return Promise.resolve(window.JSZip);
  if (!jszipPromise) {
    jszipPromise = new Promise((res, rej) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
      sc.onload = () => res(window.JSZip);
      sc.onerror = rej;
      document.head.appendChild(sc);
    });
  }
  return jszipPromise;
}

$('btnExportRecipe').addEventListener('click', () => {
  const name = $('recipeName').value.trim() || 'My Recipe';
  const clean = deepClone(S); delete clean._presetId;
  downloadBlob(new Blob([serializeRecipe(name, clean)], { type: 'application/json' }), name.replace(/\s+/g, '-').toLowerCase() + '.filmlab-recipe.json');
});
$('btnImportRecipe').addEventListener('click', () => $('fileRecipe').click());
$('fileRecipe').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const { name, settings } = parseRecipe(await f.text());
    const list = loadRecipes();
    list.push({ app: 'FilmLab', version: 1, name, settings });
    saveRecipes(list);
    renderRecipeList();
    toast('Recipe သွင်းပြီး — ' + name);
  } catch (err) { toast('Recipe ဖိုင် မရပါ — ' + err.message, 3400); }
});

/* ================= XMP import (RNI etc.) ================= */
$('fileXMP').addEventListener('change', async (e) => {
  const files = [...e.target.files];
  e.target.value = '';
  if (!files.length) return;
  const list = loadRecipes();
  let added = 0, skipped = 0, stubbed = 0;
  for (const f of files) {
    try {
      const text = await f.text();
      const isStub = /Stubbed="true"/.test(text);
      const { name, patch, found } = parseXMPSettings(text);
      if (!found) { skipped++; if (isStub) stubbed++; continue; }
      if (isStub) stubbed++;
      const rname = name || f.name.replace(/\.xmp$/i, '');
      const settings = applyPatch(defaultSettings(), patch);
      const existing = list.findIndex(r => r.name === rname);
      const rec = { app: 'FilmLab', version: 1, name: rname, settings };
      if (existing >= 0) list[existing] = rec; else list.push(rec);
      added++;
    } catch (err) { skipped++; }
  }
  saveRecipes(list);
  renderRecipeList();
  const stubNote = stubbed ? ' — သတိ: ' + stubbed + ' ခုက Look stub ဖိုင်တွေ (အရောင် အနှစ် Lightroom ထဲမှာပဲ ရှိတယ်)၊ effect မရှိ/နည်းပါး ဖြစ်မယ်' : '';
  if (added) toast('XMP ' + added + ' ခု recipe အဖြစ် သွင်းပြီး — 💾 Recipe မှာ သုံးလို့ ရပြီ' + (skipped ? ' (' + skipped + ' ခု ကျော်)' : '') + stubNote, 4600);
  else toast('XMP ထဲက ဖတ်လို့ ရတာ မတွေ့ပါ' + stubNote, 3600);
});

/* ================= Segmentation (MediaPipe, lazy) ================= */
function loadScriptOnce(src) {
  return new Promise((res, rej) => {
    if (document.querySelector('script[src="' + src + '"]')) return res();
    const sc = document.createElement('script');
    sc.src = src; sc.onload = res; sc.onerror = rej;
    document.head.appendChild(sc);
  });
}
async function ensureSegmentation() {
  const ph = activePhoto();
  if (!ph || segState === 'loading') return;
  if (segState === 'ready' && segPhotoId === ph.id) return;
  segState = 'loading';
  const panel = $('panel');
  if (panel._updSeg) panel._updSeg();
  try {
    await loadScriptOnce('https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js');
    if (!segEngine) {
      segEngine = new window.SelfieSegmentation({ locateFile: (f) => 'https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/' + f });
      segEngine.setOptions({ modelSelection: 1 });
      segEngine.onResults((results) => {
        const cur = activePhoto();
        if (!cur) return;
        const mk = document.createElement('canvas');
        mk.width = cur.img.naturalWidth; mk.height = cur.img.naturalHeight;
        const mctx = mk.getContext('2d');
        mctx.drawImage(results.segmentationMask, 0, 0, mk.width, mk.height);
        // slight mask blur for softer edges: redraw scaled down/up
        const small = document.createElement('canvas');
        small.width = Math.max(2, mk.width >> 3); small.height = Math.max(2, mk.height >> 3);
        small.getContext('2d').drawImage(mk, 0, 0, small.width, small.height);
        mctx.imageSmoothingEnabled = true;
        mctx.clearRect(0, 0, mk.width, mk.height);
        mctx.drawImage(small, 0, 0, mk.width, mk.height);
        uploadMaskCanvas(mk);
        segState = 'ready';
        segPhotoId = cur.id;
        if ($('panel')._updSeg) $('panel')._updSeg();
        scheduleRender();
      });
    }
    await segEngine.send({ image: ph.img });
  } catch (err) {
    segState = 'failed';
    useRadialMask = true;
    if ($('panel')._updSeg) $('panel')._updSeg();
    scheduleRender();
  }
}
