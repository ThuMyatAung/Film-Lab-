<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FilmLab — Photo Editor</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#101012">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #101012; color: #e8e8ea; font-family: -apple-system, "Helvetica Neue", "Noto Sans Myanmar", sans-serif; }
  button { font-family: inherit; }
  #topbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #26262a; position: sticky; top: 0; background: #101012; z-index: 20; }
  #topbar .logo { font-weight: 700; letter-spacing: .5px; font-size: 15px; margin-right: auto; }
  #topbar .logo span { color: #d4a24a; }
  .tbtn { background: #1d1d20; color: #e8e8ea; border: 1px solid #333338; border-radius: 9px; padding: 7px 11px; font-size: 12.5px; cursor: pointer; }
  .tbtn:active { background: #2a2a2f; }
  .tbtn.primary { background: #d4a24a; border-color: #d4a24a; color: #17130a; font-weight: 700; }
  #strip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px 2px; scrollbar-width: none; }
  #strip::-webkit-scrollbar { display: none; }
  .thumb { flex: 0 0 auto; width: 54px; height: 54px; border-radius: 8px; overflow: hidden; border: 2px solid transparent; cursor: pointer; position: relative; background: #1d1d20; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.active { border-color: #d4a24a; }
  .thumb .badge { position: absolute; right: 2px; bottom: 2px; background: rgba(0,0,0,.65); color: #ffd98a; font-size: 9px; padding: 1px 4px; border-radius: 4px; display: none; }

  #tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 12px 10px; scrollbar-width: none; position: sticky; top: 53px; background: #101012; z-index: 15; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; background: transparent; color: #a7a7ae; border: 1px solid #333338; border-radius: 999px; padding: 6px 13px; font-size: 12.5px; cursor: pointer; }
  .tab.active { background: #e8e8ea; color: #121214; border-color: #e8e8ea; font-weight: 700; }
  #panel { padding: 2px 16px 40px; max-width: 640px; margin: 0 auto; }
  .prow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #1e1e22; }
  .prow label { flex: 0 0 108px; font-size: 12.5px; color: #c9c9cf; }
  .prow output { flex: 0 0 38px; text-align: right; font-size: 12px; color: #d4a24a; font-variant-numeric: tabular-nums; }

  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 17px; height: 17px; border-radius: 50%; background: #e8e8ea; border: none; box-shadow: 0 1px 5px rgba(0,0,0,.6); cursor: pointer; }

  .chip.active { background: #d4a24a; border-color: #d4a24a; color: #17130a; font-weight: 700; }
  .note { font-size: 11.5px; color: #8b8b92; line-height: 1.8; padding: 8px 0; }
  .note b { color: #c9c9cf; }
  .presetGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; padding: 10px 0; }
  .preset { background: #1d1d20; border: 1px solid #2c2c31; border-radius: 10px; padding: 12px 8px; font-size: 12px; text-align: center; cursor: pointer; color: #e8e8ea; line-height: 1.5; }

  #curveWrap { padding: 10px 0; }
  #curveCanvas { background: #17171a; border: 1px solid #2c2c31; border-radius: 10px; touch-action: none; display: block; margin: 0 auto; }
  dialog { background: #1a1a1e; color: #e8e8ea; border: 1px solid #333338; border-radius: 14px; padding: 18px; width: min(92vw, 380px); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h3 { margin: 0 0 10px; font-size: 14.5px; }
  dialog input[type=text] { width: 100%; background: #101012; border: 1px solid #3a3a40; border-radius: 8px; color: #e8e8ea; padding: 9px; font-size: 13px; margin-bottom: 10px; }
  .recipeItem { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #26262a; font-size: 13px; }
  .recipeItem .nm { flex: 1; }

  .mini.danger { color: #ff9a9a; }
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: #26262b; color: #f2f2f4; border: 1px solid #3f3f46; padding: 9px 16px; border-radius: 999px; font-size: 12.5px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 50; max-width: 92vw; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

<script>
'use strict';
/* ================================================================
   FilmLab — personal photo editor (vanilla JS + WebGL1)
   All processing happens on-device. No uploads, no accounts.
   ================================================================ */

// === PURE START === (extracted by unit tests)
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

function defaultSettings() {
  return {
    exposure: 0, brightness: 0, contrast: 0, highlights: 0, shadows: 0, whites: 0, blacks: 0, fade: 0,
    temp: 0, tint: 0, vibrance: 0, saturation: 0,
    hsl: {
      red: { h: 0, s: 0, l: 0 }, orange: { h: 0, s: 0, l: 0 }, yellow: { h: 0, s: 0, l: 0 }, green: { h: 0, s: 0, l: 0 },
      aqua: { h: 0, s: 0, l: 0 }, blue: { h: 0, s: 0, l: 0 }, purple: { h: 0, s: 0, l: 0 }, magenta: { h: 0, s: 0, l: 0 }
    },
    curves: {
      master: [[0, 0], [0.25, 0.25], [0.5, 0.5], [0.75, 0.75], [1, 1]],
      r: [[0, 0], [1, 1]], g: [[0, 0], [1, 1]], b: [[0, 0], [1, 1]]
    },
    lutName: '', lutIntensity: 80,
    grain: 0, grainSize: 50, vignette: 0, sharpen: 0, leak: 0, dust: 0,
    distortion: 0, perspV: 0, perspH: 0, rotate: 0,
    bokeh: 0, focusX: 0.5, focusY: 0.42
  };
}

const FACTORY_PRESETS = [
  { id: 'natural', name: 'Natural Film', sub: 'သဘာဝ ဖလင် — skin texture မပျက်', patch: {
      contrast: 6, fade: 8, temp: 4, vibrance: 10, saturation: -4, grain: 20, vignette: 10, sharpen: 15,
      curves: { master: [[0, 0.03], [0.25, 0.26], [0.5, 0.52], [0.75, 0.77], [1, 0.98]] } } },
  { id: 'portra', name: 'Portra Warm', sub: 'နွေး · portrait', patch: {
      temp: 9, tint: 2, saturation: -6, vibrance: 8, contrast: 2, fade: 12, grain: 16, highlights: -10, sharpen: 10,
      curves: { master: [[0, 0.04], [0.25, 0.27], [0.5, 0.51], [0.75, 0.75], [1, 0.97]],
                r: [[0, 0], [0.5, 0.53], [1, 1]], b: [[0, 0], [0.5, 0.46], [1, 0.97]] } } },
  { id: 'mono', name: 'Mono', sub: 'B&W · HP5 ပုံစံ', patch: {
      saturation: -100, contrast: 14, blacks: -6, grain: 34, vignette: 14, sharpen: 10,
      curves: { master: [[0, 0.02], [0.25, 0.22], [0.5, 0.5], [0.75, 0.79], [1, 0.99]] } } },
  { id: 'instant', name: 'Faded Instant', sub: 'ဖျော့ · retro', patch: {
      fade: 30, saturation: -16, temp: 6, contrast: -8, grain: 20, vignette: 20, leak: 14,
      curves: { master: [[0, 0.09], [0.5, 0.52], [1, 0.94]] } } },
  { id: 'chrome', name: 'Chrome Pop', sub: 'စူး · အရောင် ထက်', patch: {
      contrast: 16, saturation: 12, vibrance: 14, highlights: -6, sharpen: 20, grain: 6 } },
  { id: 'clean', name: 'Clean', sub: 'အသန့် — ပြင်ရုံ သက်သက်', patch: { sharpen: 12 } }
];

function applyPatch(settings, patch) {
  const out = deepClone(settings);
  for (const k of Object.keys(patch)) {
    if (patch[k] && typeof patch[k] === 'object' && !Array.isArray(patch[k]) && out[k] && typeof out[k] === 'object') {
      for (const k2 of Object.keys(patch[k])) out[k][k2] = deepClone(patch[k][k2]);
    } else out[k] = deepClone(patch[k]);
  }
  return out;
}

// Smooth curve through control points (Catmull-Rom), returns y for x in [0,1]
function curveEval(points, x) {
  const pts = points.slice().sort((a, b) => a[0] - b[0]);
  if (x <= pts[0][0]) return pts[0][1];
  if (x >= pts[pts.length - 1][0]) return pts[pts.length - 1][1];
  let i = 0;
  while (i < pts.length - 2 && x > pts[i + 1][0]) i++;
  const p1 = pts[i], p2 = pts[i + 1];
  // phantom endpoints by reflection (duplicating endpoints halves the tangent and bows the curve)
  const p0 = i > 0 ? pts[i - 1] : [2 * p1[0] - p2[0], 2 * p1[1] - p2[1]];
  const p3 = i + 2 < pts.length ? pts[i + 2] : [2 * p2[0] - p1[0], 2 * p2[1] - p1[1]];
  const t = (x - p1[0]) / Math.max(1e-6, (p2[0] - p1[0]));
  const t2 = t * t, t3 = t2 * t;
  const y = 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
  return clamp(y, 0, 1);
}

// Combined per-channel curve LUT (master then channel), 256 entries per channel
function buildCurvesLUT(curves) {
  const lut = { r: new Uint8Array(256), g: new Uint8Array(256), b: new Uint8Array(256) };
  const chans = ['r', 'g', 'b'];
  for (let v = 0; v < 256; v++) {
    const afterMaster = curveEval(curves.master, v / 255);
    for (const c of chans) lut[c][v] = Math.round(clamp(curveEval(curves[c], afterMaster), 0, 1) * 255);
  }
  return lut;
}

// Parse a .cube LUT file -> { size, data: Float32Array (size^3 * 3), title }
function parseCUBE(text) {
  const lines = text.split(/\r?\n/);
  let size = 0, title = '';
  const data = [];
  for (let raw of lines) {
    const line = raw.trim();
    if (!line || line.startsWith('#')) continue;
    const up = line.toUpperCase();
    if (up.startsWith('TITLE')) { const m = line.match(/"([^"]*)"/); if (m) title = m[1]; continue; }
    if (up.startsWith('LUT_3D_SIZE')) { size = parseInt(line.split(/\s+/)[1], 10); continue; }
    if (up.startsWith('LUT_1D') || up.startsWith('DOMAIN')) continue;
    const parts = line.split(/\s+/).map(Number);
    if (parts.length >= 3 && parts.every(n => Number.isFinite(n))) data.push(parts[0], parts[1], parts[2]);
  }
  if (!size || data.length < size * size * size * 3) throw new Error('CUBE ဖိုင် မှား — LUT_3D_SIZE သို့ data မပြည့်စုံ');
  return { size, data: Float32Array.from(data.slice(0, size * size * size * 3)), title };
}

// Pack an RGB LUT (size^3, r-fastest order) into a 2D texture image:
// width = size*size, height = size; pixel (b*size + r, g) = entry (r, g, b)
function packLUTTexture(lut) {
  const N = lut.size, w = N * N, h = N;
  const px = new Uint8Array(w * h * 4);
  for (let b = 0; b < N; b++) for (let g = 0; g < N; g++) for (let r = 0; r < N; r++) {
    const si = ((b * N + g) * N + r) * 3;
    const di = (g * w + (b * N + r)) * 4;
    px[di] = clamp(Math.round(lut.data[si] * 255), 0, 255);
    px[di + 1] = clamp(Math.round(lut.data[si + 1] * 255), 0, 255);
    px[di + 2] = clamp(Math.round(lut.data[si + 2] * 255), 0, 255);
    px[di + 3] = 255;
  }
  return { width: w, height: h, pixels: px };
}

// Decode a square Hald CLUT image (side = S^1.5, entries row-major r->g->b)
// pixels: Uint8Array RGBA of side*side. Returns an RGB LUT { size, data }.
function haldToLUT(pixels, side) {
  const S = Math.round(Math.pow(side, 2 / 3));
  if (S * S * S !== side * side) throw new Error('Hald ပုံ အရွယ် မကိုက် (512×512 သုံးပါ)');
  const data = new Float32Array(S * S * S * 3);
  for (let i = 0; i < S * S * S; i++) {
    data[i * 3] = pixels[i * 4] / 255;
    data[i * 3 + 1] = pixels[i * 4 + 1] / 255;
    data[i * 3 + 2] = pixels[i * 4 + 2] / 255;
  }
  return { size: S, data };
}

// Identity (neutral) Hald pixels for the given size S (side = S^1.5)
function identityHaldPixels(S) {
  const side = Math.round(Math.pow(S, 1.5));
  const px = new Uint8Array(side * side * 4);
  for (let b = 0; b < S; b++) for (let g = 0; g < S; g++) for (let r = 0; r < S; r++) {
    const idx = (b * S + g) * S + r;
    px[idx * 4] = Math.round(r / (S - 1) * 255);
    px[idx * 4 + 1] = Math.round(g / (S - 1) * 255);
    px[idx * 4 + 2] = Math.round(b / (S - 1) * 255);
    px[idx * 4 + 3] = 255;
  }
  return { side, pixels: px };
}

function serializeRecipe(name, settings) {
  return JSON.stringify({ app: 'FilmLab', version: 1, name, settings }, null, 1);
}
function parseRecipe(text) {
  const o = JSON.parse(text);
  if (!o || o.app !== 'FilmLab' || !o.settings) throw new Error('Recipe ဖိုင် မဟုတ်ပါ');
  const merged = applyPatch(defaultSettings(), o.settings);
  return { name: o.name || 'Recipe', settings: merged };
}
function settingsDirty(a, b) { return JSON.stringify(a) !== JSON.stringify(b); }
// === PURE END ===
</script>
<script>
'use strict';
/* ================= WebGL pipeline ================= */
const viewCanvas = document.getElementById('view');
const gl = viewCanvas.getContext('webgl', { preserveDrawingBuffer: false, antialias: false });
if (!gl) document.getElementById('glwarn').style.display = 'block';

const VERT = `
attribute vec2 aPos; varying vec2 vUv;
void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

const GRADE_FRAG = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform float uAspect, uDistort, uPerspV, uPerspH, uRotate, uZoom;
uniform float uExposure, uBrightness, uContrast, uHighlights, uShadows, uWhites, uBlacks, uFade;
uniform float uTemp, uTint, uVibrance, uSaturation;
uniform vec3 uHsl[8];
uniform sampler2D uCurves;
uniform sampler2D uLUT; uniform float uLutSize, uLutAmt, uHasLUT;
float lum(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
vec2 geoUv(vec2 uv0){
  vec2 uv = uv0 - 0.5;
  uv.x /= (1.0 + uPerspV * uv.y * 1.6);
  uv.y /= (1.0 + uPerspH * uv.x * 1.6);
  vec2 rp = vec2(uv.x * uAspect, uv.y);
  float ca = cos(uRotate), sa = sin(uRotate);
  rp = mat2(ca, -sa, sa, ca) * rp;
  rp *= uZoom;
  uv = vec2(rp.x / uAspect, rp.y);
  float r2 = (uv.x * uAspect) * (uv.x * uAspect) + uv.y * uv.y;
  uv *= (1.0 + uDistort * r2);
  return uv + 0.5;
}
float hueWeight(float hDeg, float center){
  float d = abs(hDeg - center); d = min(d, 360.0 - d);
  return clamp(1.0 - d / 32.0, 0.0, 1.0);
}
vec3 applyHSL(vec3 c){
  float mx = max(max(c.r, c.g), c.b), mn = min(min(c.r, c.g), c.b);
  float d = mx - mn; if (d < 0.0001) return c;
  float l = (mx + mn) * 0.5;
  float s = l > 0.5 ? d / (2.0 - mx - mn) : d / (mx + mn);
  float h;
  if (mx == c.r) h = (c.g - c.b) / d + (c.g < c.b ? 6.0 : 0.0);
  else if (mx == c.g) h = (c.b - c.r) / d + 2.0;
  else h = (c.r - c.g) / d + 4.0;
  h *= 60.0;
  float centers[8];
  centers[0]=0.0; centers[1]=30.0; centers[2]=60.0; centers[3]=125.0; centers[4]=180.0; centers[5]=240.0; centers[6]=285.0; centers[7]=325.0;
  float hShift = 0.0, sMul = 0.0, lAdd = 0.0;
  for (int i = 0; i < 8; i++) {
    float w = hueWeight(h, centers[i]);
    hShift += uHsl[i].x * w; sMul += uHsl[i].y * w; lAdd += uHsl[i].z * w;
  }
  h = mod(h + hShift, 360.0);
  s = clamp(s * (1.0 + sMul * 0.01), 0.0, 1.0);
  l = clamp(l + lAdd * 0.0025, 0.0, 1.0);
  float cc = (1.0 - abs(2.0 * l - 1.0)) * s;
  float x = cc * (1.0 - abs(mod(h / 60.0, 2.0) - 1.0));
  float m = l - cc * 0.5;
  vec3 rgb;
  if (h < 60.0) rgb = vec3(cc, x, 0.0); else if (h < 120.0) rgb = vec3(x, cc, 0.0);
  else if (h < 180.0) rgb = vec3(0.0, cc, x); else if (h < 240.0) rgb = vec3(0.0, x, cc);
  else if (h < 300.0) rgb = vec3(x, 0.0, cc); else rgb = vec3(cc, 0.0, x);
  return rgb + m;
}
vec3 applyLUT(vec3 c){
  float N = uLutSize;
  vec3 sc = clamp(c, 0.0, 1.0) * (N - 1.0);
  float b0 = floor(sc.b), b1 = min(b0 + 1.0, N - 1.0), bf = sc.b - b0;

  renderPipeline(st, w, h, false);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbos.export.fb);
  const px = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const im = ctx.createImageData(w, h);
  const rowLen = w * 4;
  for (let y = 0; y < h; y++) {
    im.data.set(px.subarray((h - 1 - y) * rowLen, (h - y) * rowLen), y * rowLen);
  }
  ctx.putImageData(im, 0, 0);
  return cv;
}
function exportPhotoBlob(ph) {
  return new Promise((resolve, reject) => {
    const cur = activePhoto();
    const needSwitch = !cur || cur.id !== ph.id;
    if (needSwitch) { uploadSourceImage(ph.img); }
    const cv = renderToPixels(ph.settings, ph.img.naturalWidth, ph.img.naturalHeight);
    if (needSwitch && cur) uploadSourceImage(cur.img);
    cv.toBlob((b) => b ? resolve(b) : reject(new Error('export မရပါ')), 'image/jpeg', 0.92);
  });
}
$('btnExport').addEventListener('click', async () => {
  const ph = activePhoto();
  if (!ph) { toast('ဓာတ်ပုံ အရင် ဖွင့်ပါ'); return; }
  toast('Export လုပ်နေတယ်…');
  try {
    const blob = await exportPhotoBlob(ph);
    downloadBlob(blob, ph.name.replace(/\.[^.]+$/, '') + '-filmlab.jpg');
    toast('Export ပြီးပြီ');
  } catch (err) { toast(err.message, 3600); }
  scheduleRender();
});
let jszipPromise = null;
function loadJSZip() {
  if (window.JSZip) return Promise.resolve(window.JSZip);
  if (!jszipPromise) {
    jszipPromise = new Promise((res, rej) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
      sc.onload = () => res(window.JSZip);
      sc.onerror = rej;
      document.head.appendChild(sc);
    });
  }
  return jszipPromise;
}
$('btnBatch').addEventListener('click', async () => {
  const ph = activePhoto();
  if (!ph) { toast('ဓာတ်ပုံ အရင် ဖွင့်ပါ'); return; }
  if (photos.length < 2) { toast('ပုံ တစ်ပုံထက် ပို ဖွင့်ထားမှ အစုလိုက် ရမယ်'); return; }
  toast('အစုလိုက် ပြင်နေတယ် — လက်ရှိ ပုံရဲ့ setting ကို အားလုံးမှာ သုံးမယ်');
  try {
    const JSZip = await loadJSZip();
    const zip = new JSZip();
    for (const p of photos) {
      const st = deepClone(ph.settings);
      st.focusX = p.settings.focusX; st.focusY = p.settings.focusY;
      const blob = await exportPhotoBlob({ ...p, settings: st });
      zip.file(p.name.replace(/\.[^.]+$/, '') + '-filmlab.jpg', blob);
    }
    const out = await zip.generateAsync({ type: 'blob' });
    downloadBlob(out, 'filmlab-batch.zip');
    toast('Batch ပြီးပြီ — ZIP ထုတ်ပေးလိုက်ပြီ');
  } catch (err) {
    toast('ZIP မရလို့ တစ်ပုံချင်း ထုတ်ပေးမယ်', 3200);
    for (const p of photos) {
      const blob = await exportPhotoBlob({ ...p, settings: deepClone(ph.settings) });
      downloadBlob(blob, p.name.replace(/\.[^.]+$/, '') + '-filmlab.jpg');
      await new Promise(r => setTimeout(r, 450));
    }
  }
  if (activePhoto()) { uploadSourceImage(activePhoto().img); }
  scheduleRender();
});

/* ================= Recipes ================= */
const RECIPE_KEY = 'filmlab_recipes_v1';
function loadRecipes() {
  try { return JSON.parse(localStorage.getItem(RECIPE_KEY) || '[]'); } catch (e) { return []; }
}
function saveRecipes(list) { localStorage.setItem(RECIPE_KEY, JSON.stringify(list)); }
function renderRecipeList() {
  const box = $('recipeList');
  box.innerHTML = '';
  const list = loadRecipes();
  if (!list.length) { box.innerHTML = '<div class="note">သိမ်းထားတဲ့ recipe မရှိသေးပါ</div>'; return; }
  list.forEach((r, i) => {
    const row = document.createElement('div');
    row.className = 'recipeItem';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = r.name;
    const ap = document.createElement('button'); ap.className = 'mini'; ap.textContent = 'သုံးမယ်';
    ap.addEventListener('click', () => {
      const fresh = parseRecipe(JSON.stringify(r)).settings;
      fresh.lutName = S.lutName; fresh.lutIntensity = S.lutIntensity;
      replaceSettings(fresh);
      $('recipeDlg').close();
      toast('Recipe သုံးပြီး — ' + r.name);
    });
    const del = document.createElement('button'); del.className = 'mini danger'; del.textContent = 'ဖျက်';
    del.addEventListener('click', () => { const l = loadRecipes(); l.splice(i, 1); saveRecipes(l); renderRecipeList(); });
    row.append(nm, ap, del);
    box.appendChild(row);
  });
}
$('btnRecipe').addEventListener('click', () => { renderRecipeList(); $('recipeDlg').showModal(); });
$('btnCloseRecipe').addEventListener('click', () => $('recipeDlg').close());
$('btnSaveRecipe').addEventListener('click', () => {
  const name = $('recipeName').value.trim() || ('Recipe ' + (loadRecipes().length + 1));
  const list = loadRecipes();
  const clean = deepClone(S); delete clean._presetId;
  list.push({ app: 'FilmLab', version: 1, name, settings: clean });
  saveRecipes(list);
  $('recipeName').value = '';
  renderRecipeList();
  toast('Recipe သိမ်းပြီး — ' + name);
});
$('btnExportRecipe').addEventListener('click', () => {
  const name = $('recipeName').value.trim() || 'My Recipe';
  const clean = deepClone(S); delete clean._presetId;
  downloadBlob(new Blob([serializeRecipe(name, clean)], { type: 'application/json' }), name.replace(/\s+/g, '-').toLowerCase() + '.filmlab-recipe.json');
});
$('btnImportRecipe').addEventListener('click', () => $('fileRecipe').click());
$('fileRecipe').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const { name, settings } = parseRecipe(await f.text());
    const list = loadRecipes();
    list.push({ app: 'FilmLab', version: 1, name, settings });
    saveRecipes(list);
    renderRecipeList();
    toast('Recipe သွင်းပြီး — ' + name);
  } catch (err) { toast('Recipe ဖိုင် မရပါ — ' + err.message, 3400); }
});

/* ================= Segmentation (MediaPipe, lazy) ================= */
function loadScriptOnce(src) {
  return new Promise((res, rej) => {
    if (document.querySelector('script[src="' + src + '"]')) return res();
    const sc = document.createElement('script');
    sc.src = src; sc.onload = res; sc.onerror = rej;
    document.head.appendChild(sc);
  });
}
async function ensureSegmentation() {
  const ph = activePhoto();
  if (!ph || segState === 'loading') return;
  if (segState === 'ready' && segPhotoId === ph.id) return;
  segState = 'loading';
  const panel = $('panel');
  if (panel._updSeg) panel._updSeg();
  try {
    await loadScriptOnce('https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js');
    if (!segEngine) {
      segEngine = new window.SelfieSegmentation({ locateFile: (f) => 'https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/' + f });
      segEngine.setOptions({ modelSelection: 1 });
      segEngine.onResults((results) => {
        const cur = activePhoto();
        if (!cur) return;
        const mk = document.createElement('canvas');
        mk.width = cur.img.naturalWidth; mk.height = cur.img.naturalHeight;
        const mctx = mk.getContext('2d');
        mctx.drawImage(results.segmentationMask, 0, 0, mk.width, mk.height);
        // slight mask blur for softer edges: redraw scaled down/up
        const small = document.createElement('canvas');
        small.width = Math.max(2, mk.width >> 3); small.height = Math.max(2, mk.height >> 3);
        small.getContext('2d').drawImage(mk, 0, 0, small.width, small.height);
        mctx.imageSmoothingEnabled = true;
        mctx.clearRect(0, 0, mk.width, mk.height);
        mctx.drawImage(small, 0, 0, mk.width, mk.height);
        uploadMaskCanvas(mk);
        segState = 'ready';
        segPhotoId = cur.id;
        if ($('panel')._updSeg) $('panel')._updSeg();
        scheduleRender();
      });
    }
    await segEngine.send({ image: ph.img });
  } catch (err) {
    segState = 'failed';
    useRadialMask = true;
    if ($('panel')._updSeg) $('panel')._updSeg();
    scheduleRender();
  }
}
